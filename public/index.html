<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoachRun AI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <div class="header-container">
      <h1>CoachRun AI</h1>
      <div class="header-controls">
        <button id="theme-toggle" class="theme-btn">🌙 Dark Mode</button>
      </div>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <div id="image-preview-wrapper" class="image-preview-wrapper" style="display: none;">
      <div class="preview-container">
        <img id="image-preview" src="" alt="Preview" />
        <button type="button" id="clear-image-btn" class="clear-image-btn">&times;</button>
      </div>
    </div>
    <form id="chat-form">
      <input type="file" id="image-input" accept="image/*" style="display: none;" />
      <button type="button" id="upload-btn" class="upload-btn">📎</button>
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
